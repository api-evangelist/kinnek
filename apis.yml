name: Kinnek
description: >-
  Kinnek was a B2B purchasing marketplace that helped small and mid-sized
  businesses buy from suppliers. Buyers could describe what they needed, collect
  competitive quotes from vetted suppliers, read unbiased reviews, and get expert
  purchasing advice in one place, under the tagline "Purchasing Made Painless."
  The company operated at kinnek.com but is no longer active: the domain no
  longer resolves (no DNS A, MX, NS, or SOA records) and the site survives only
  via the Internet Archive (strongest snapshot circa 2017). It was added to the
  API Evangelist network as a venture-portfolio lead (backed by 500 Global and
  Version One Ventures); the enrichment pass found no public API, developer
  portal, documentation, or machine-readable specifications for this provider.
